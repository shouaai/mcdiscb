# Private tmux server used only by mcbot (tmux -L mcbot). Your own tmux is untouched.
set -g remain-on-exit on          # keep a crashed pane around so the bot can read the error
set -g history-limit 50000
set -g mouse on
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left "#[bold] mcbot #[nobold]"
set -g status-left-length 12
set -g status-right " Ctrl+b d = detach "
set -g window-status-current-style "bold,fg=#fabd2f"
